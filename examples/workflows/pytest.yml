# Copy to .github/workflows/ in your repository. Store the workspace service key as the secret TO_API_KEY
# and put your project's prj_ id (project settings page) in `project`.
# Project used to test this file: examples/pytest (pytest --junitxml).
name: tests
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pytest
      - run: pytest --junitxml=reports/pytest.xml
      - name: Report to TestOrchestrator
        if: ${{ !cancelled() }}
        uses: testorchestratorhq/report-results@v1
        with:
          api-key: ${{ secrets.TO_API_KEY }}
          project: prj_8kd2hq0vxc1a
          files: reports/*.xml
