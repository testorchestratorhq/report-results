# Copy to .github/workflows/ in your repository. Store the workspace service key as the secret TO_API_KEY
# and put your project's prj_ id (project settings page) in `project`.
# Project used to test this file: examples/jest (Jest with the jest-junit reporter).
name: tests
on: [push, pull_request]

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx jest --ci --reporters=default --reporters=jest-junit
      - name: Report to TestOrchestrator
        if: ${{ !cancelled() }}
        uses: testorchestratorhq/report-results@v1
        with:
          api-key: ${{ secrets.TO_API_KEY }}
          project: prj_8kd2hq0vxc1a
          files: reports/jest-junit.xml
          run-name: Jest · ${{ github.ref_name }}
